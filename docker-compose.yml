# Backend-only VPS stack. The frontend is deployed separately on Vercel,
# MongoDB is hosted by Atlas, and Redis is the existing VPS container.
services:
  backend:
    image: anando1/id-backend:${BACKEND_VERSION:-latest}
    pull_policy: always
    container_name: id_backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Deployment endpoints come from the VPS .env file; they are never baked
      # into the image or committed in this Compose file.
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in the VPS .env file}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-id}
      REDIS_URL: ${REDIS_URL:-redis://honcho-redis:6379}
    ports:
      - "4000:4000"
    networks:
      - default
      - vps_redis

networks:
  # This must be the network already attached to `honcho-redis`.
  vps_redis:
    external: true
    name: ${VPS_REDIS_NETWORK:-honcho_default}
