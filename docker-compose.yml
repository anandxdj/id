# Backend-only VPS stack. The frontend is deployed separately on Vercel,
# MongoDB is hosted by Atlas, and Redis is the existing VPS container.
services:
  backend:
    image: anando1/id-backend:${BACKEND_VERSION:-latest}
    pull_policy: always
    container_name: id_backend
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Deployment endpoints come from the VPS .env file; they are never baked
      # into the image or committed in this Compose file.
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in the VPS .env file}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-id}
      REDIS_URL: ${REDIS_URL:-redis://honcho-redis:6379}
    networks:
      - proxy
      - honcho_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.id-backend.rule=Host(`id-backend.anands.dev`)"
      - "traefik.http.routers.id-backend.entrypoints=web"
      - "traefik.http.services.id-backend.loadbalancer.server.port=4000"
      - "traefik.docker.network=proxy"

networks:
  # Traefik discovers the backend over this network.
  proxy:
    external: true
  # The existing `honcho-redis` container is reachable on this network.
  honcho_internal:
    external: true
